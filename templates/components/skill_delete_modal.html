<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-skill-{{ skill.id }}"
            aria-label="Hapus {{ skill.title }}"
            title="Hapus Keahlian">
        Hapus Skill
    </button>
</p>
<div id="delete-skill-{{ skill.id }}"
     class="skill-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-skill-title-{{ skill.id }}">
    <button type="button"
            class="skill-delete-modal__backdrop"
            popovertarget="delete-skill-{{ skill.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="skill-delete-modal__content">
        <button type="button"
                class="skill-delete-modal__close"
                popovertarget="delete-skill-{{ skill.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-skill-title-{{ skill.id }}">Hapus Keahlian?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ skill.title }}</strong>?
        </p>
        <div class="skill-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-skill-{{ skill.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_skill' skill.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
